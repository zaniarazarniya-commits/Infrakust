<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: #0C0D0E;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px 100px;
      font-family: Georgia, serif;
      overflow: hidden;
    }
    .eyebrow {
      font-family: Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #C9A96E;
      margin-bottom: 28px;
    }
    h1 {
      font-size: 72px;
      font-weight: normal;
      color: #F5F0EB;
      line-height: 1.05;
      letter-spacing: -0.025em;
      max-width: 820px;
    }
    h1 em {
      color: #C9A96E;
      font-style: italic;
    }
    .sub {
      font-family: Arial, sans-serif;
      font-size: 18px;
      color: #6B6560;
      margin-top: 28px;
      letter-spacing: 0.02em;
    }
    .logo {
      position: absolute;
      bottom: 60px;
      right: 100px;
      font-family: Georgia, serif;
      font-size: 20px;
      color: #F5F0EB;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <p class="eyebrow">DIGITAL BYRÅ · LYSEKIL</p>
  <h1>Hemsidor som <em>konverterar.</em><br>Appar som <em>används.</em></h1>
  <p class="sub">infrakust.se</p>
  <span class="logo">Infrakust</span>
</body>
</html>
