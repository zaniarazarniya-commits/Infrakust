<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0C0D0E"/>

  <!-- Subtle gold gradient vignette top-left -->
  <radialGradient id="glow" cx="20%" cy="30%" r="60%">
    <stop offset="0%" stop-color="#C9A96E" stop-opacity="0.07"/>
    <stop offset="100%" stop-color="#0C0D0E" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Gold "I" icon — top center -->
  <rect x="572" y="130" width="56" height="56" rx="10" fill="#0C0D0E" stroke="#C9A96E" stroke-width="1.5"/>
  <text x="600" y="174" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-style="italic" font-weight="normal" fill="#C9A96E" text-anchor="middle">I</text>

  <!-- Infrakust wordmark -->
  <text x="600" y="310" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="normal" fill="#F5F0EB" text-anchor="middle" letter-spacing="-1">Infrakust</text>

  <!-- Divider line -->
  <line x1="480" y1="340" x2="720" y2="340" stroke="#C9A96E" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Subtitle -->
  <text x="600" y="390" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#9A9590" text-anchor="middle" letter-spacing="1">Digital byrå från Lysekil.</text>

  <!-- Bottom tagline -->
  <text x="600" y="490" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B6560" text-anchor="middle" letter-spacing="3">WEBB · APPAR · SYSTEM</text>
</svg>
